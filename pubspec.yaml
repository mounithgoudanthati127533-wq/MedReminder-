name: med_reminder
description: MedReminder – AI Medicine Schedule Assistant
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # Database
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Notifications
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # Camera / Image picker
  image_picker: ^1.1.2

  # Google ML Kit OCR
  google_mlkit_text_recognition: ^0.13.0

  # Permissions
  permission_handler: ^11.3.1

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  flutter_slidable: ^3.1.1
  table_calendar: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
